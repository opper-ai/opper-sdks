# Schemas and endpoints in the OpenAPI spec that the SDKs do not use.
# The pull-openapi.sh diff script reads this file and filters out matching
# changes so the output only shows what matters for SDK maintenance.
#
# Format:
#   schemas   – list of schema names to ignore (exact match)
#   endpoints – list of path prefixes to ignore

schemas:
  # Compat API schemas (Messages, Responses, Chat, Interactions) – removed from SDKs
  - AnthropicCompatModel
  - AnthropicCompatModelsListResponse
  - ChatChoice
  - ChatMessage
  - ChatRequest
  - ChatRequestMessage
  - ChatRequestTool
  - ChatResponse
  - ChatStreamChunk
  - ChatStreamDelta
  - ChatUsage
  - InteractionsRequest
  - InteractionsResponse
  - InteractionsUsage
  - InteractionsUsageMetadata
  - InteractionsOutput
  - InteractionsTool
  - GenerationConfig
  - MessagesMessage
  - MessagesRequest
  - MessagesResponse
  - MessagesResponseBlock
  - MessagesTool
  - MessagesUsage
  - ORRequest
  - ORStreamEventCompleted
  - ORStreamEventContentPartAdded
  - ORStreamEventContentPartDone
  - ORStreamEventError
  - ORStreamEventFunctionCallArgumentsDelta
  - ORStreamEventFunctionCallArgumentsDone
  - ORStreamEventOutputItemAdded
  - ORStreamEventOutputItemDone
  - ORStreamEventOutputTextDelta
  - ORStreamEventOutputTextDone
  - ORStreamEventReasoningSummaryDelta
  - ORStreamEventReasoningSummaryDone
  - ORStreamEventResponseCreated
  - ORStreamEventResponseInProgress
  - PendingResponseMeta
  - ReasoningConfig
  - ResponsesError
  - ResponsesOutputContent
  - ResponsesOutputItem
  - ResponsesOutputTokensDetails
  - ResponsesRequest
  - ResponsesResponse
  - ResponsesTool
  - ResponsesUsage
  # Beta endpoints not yet exposed by the SDKs
  - Benchmark
  - BenchmarkEvaluations
  - ModelListItem
  - ModelResolveRequest
  - ModelResolveResponse
  - Route
  - RouteDataHandling
  - RouteGDPR
  - RouteLogging
  - RouteTraining
  - RouteZDR
  # Legacy function-based realtime — superseded by model-driven `/v3/realtime` +
  # ephemeral tickets via `/v3/realtime-sessions`. Not exposed by the SDKs.
  - RealtimeCreateRequest
  - RealtimeCreateResponse

endpoints:
  # Compat endpoints not exposed by the SDKs
  - /v3/compat/v1/messages
  - /v3/compat/v1/models
  - /v3/compat/responses
  - /v3/compat/chat/completions
  - /v3/compat/v1beta/interactions
  # Beta endpoints not yet exposed by the SDKs.
  - /v3/tools/models/resolve
  # Legacy function-based realtime — superseded by model-driven `/v3/realtime` +
  # ephemeral tickets via `/v3/realtime-sessions`.
  # NOTE: prefix matching — `/v3/realtime/` (with trailing slash) targets only
  # `/v3/realtime/{name}` and leaves `/v3/realtime` (no slash) exposed.
  - /v3/functions/{name}/realtime
  - /v3/realtime/
