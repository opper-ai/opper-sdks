  /v3/models:
    get:
      description: "Endpoint to retrieve model info. Optional `include` adds extra fields per item: `maker` (underlying-weights creator, e.g. `meta` for Llama), `route` (data-handling / legal block — requires an Opper API key), `benchmarks` (public scores from artificialanalysis.ai; absent for realtime, OCR, image-gen, and other specialty models). Comma-separated, e.g. `?include=maker,benchmarks`."
      operationId: listModels
      parameters:
        - description: "Comma-separated list of optional fields to attach to each item. Supported: `maker` (public), `route` (requires API key), `benchmarks` (public)."
          in: query
          name: include
          schema:
            example: maker,benchmarks
            type: string
        - description: Free-text search across model ID, name, and description.
          in: query
          name: q
          schema:
            type: string
        - description: Filter by provider name (e.g. `openai`, `anthropic`).
          in: query
          name: provider
          schema:
            type: string
        - description: Filter by model type (`llm`, `image`, `tts`, `stt`, `video`, `realtime`, `embedding`, `rerank`, `ocr`).
          in: query
          name: type
          schema:
            type: string
        - description: Filter by capability (repeatable). Items matching ALL listed capabilities are returned.
          in: query
          name: capability
          schema:
            items:
              type: string
            type: array
        - description: Set to `true` to include retired models in results.
          in: query
          name: deprecated
          schema:
            type: boolean
        - description: Field to sort by (`id`, `name`, `provider`, `type`, `cost`, `speed`, `quality`, `context_window`). Default `id`.
          in: query
          name: sort
          schema:
            default: id
            type: string
        - description: "`asc` (default) or `desc`."
          in: query
          name: order
          schema:
            default: asc
            type: string
        - description: Pagination offset.
          in: query
          name: offset
          schema:
            default: 0
            minimum: 0
            type: integer
        - description: Page size (max 500).
          in: query
          name: limit
          schema:
            default: 50
            maximum: 500
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"
          description: Successful response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security: []
      summary: List models
      tags:
        - Models
