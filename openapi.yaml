info:
  description: Schema-driven generative API that orchestrates LLM-powered workflows.
  title: Task API
  version: 3.0.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Returns server health status.
      operationId: healthCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  status:
                    example: ok
                    type: string
                type: object
          description: Successful response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      security: []
      summary: Health check
      tags:
        - System
  /v3/artifacts/{id}/status:
    get:
      description: Poll for async artifact generation status. Returns a presigned download URL when the generation is complete.
      operationId: getArtifactStatus
      parameters:
        - description: Artifact generation ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: Error message (only when failed)
                    type: string
                  id:
                    type: string
                  mime_type:
                    type: string
                  status:
                    enum:
                      - processing
                      - completed
                      - failed
                    type: string
                  url:
                    description: Presigned download URL (only when completed)
                    type: string
                type: object
          description: Successful response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          description: "Unauthorized - missing or invalid API key"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Get artifact generation status
      tags:
        - Artifacts
  /v3/call:
    post:
      description: Execute a function by name (passed in the request body). If no cached script exists, one is generated automatically.
      operationId: call
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
          description: Successful response
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingResponse"
          description: Accepted – async operation pending. Poll the status URL in meta.pending_operations.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          description: "Unauthorized - missing or invalid API key"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Call function by name
      tags:
        - Functions
  /v3/call/stream:
    post:
      description: Execute a function by name (passed in the request body) with SSE streaming output.
      operationId: callStream
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
            text/event-stream:
              schema:
                description: "Server-Sent Events stream. Each event is a JSON object prefixed with 'data: '."
                type: string
          description: Successful response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          description: "Unauthorized - missing or invalid API key"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Stream function by name
      tags:
        - Functions
  /v3/compat/chat/completions:
    post:
      description: OpenAI-compatible chat completions endpoint. Supports streaming via the stream parameter.
      operationId: chatCompletions
      parameters:
        - description: Function name for tracing and project-level guardrail function-scope filtering.
          in: header
          name: X-Opper-Name
          schema:
            type: string
        - description: Parent span ID for distributed tracing context.
          in: header
          name: X-Opper-Parent-Span-Id
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
            text/event-stream:
              schema:
                description: "Server-Sent Events stream. Each event is `data: <json>` (a `chat.completion.chunk` object). The stream terminates with `data: [DONE]`. When `stream_options.include_usage` is true, the final chunk before `[DONE]` carries `usage` and an Opper `cost` extension."
                type: string
          description: Successful response
          headers:
            X-Opper-Cost:
              description: Execution cost of the request as a floating-point number.
              schema:
                format: double
                type: number
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          description: "Unauthorized - missing or invalid API key"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Chat Completions API
      tags:
        - Compatibility
  /v3/compat/embeddings:
    post:
      description: OpenAI-compatible embeddings endpoint.
      operationId: createEmbeddings
      parameters:
        - description: Function name for tracing and project-level guardrail function-scope filtering.
          in: header
          name: X-Opper-Name
          schema:
            type: string
        - description: Parent span ID for distributed tracing context.
          in: header
          name: X-Opper-Parent-Span-Id
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingsResponse"
          description: Successful response
          headers:
            X-Opper-Cost:
              description: Execution cost of the request as a floating-point number.
              schema:
                format: double
                type: number
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          description: "Unauthorized - missing or invalid API key"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Embeddings API
      tags:
        - Compatibility
  /v3/compat/openresponses:
    post:
      description: "OpenResponses-compatible endpoint with multi-provider support and opper: extension items."
      operationId: createOpenResponse
      parameters:
        - description: Function name for tracing and project-level guardrail function-scope filtering.
          in: header
          name: X-Opper-Name
          schema:
            type: string
        - description: Parent span ID for distributed tracing context.
          in: header
          name: X-Opper-Parent-Span-Id
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ORRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ORResponse"
            text/event-stream:
              schema:
                description: "Server-Sent Events stream. Each event has an `event:` line and a `data: <json>` line; the payload's `type` field discriminates the event. The stream terminates with a `response.completed` event whose payload carries the final `usage` (token counts and `cost`)."
                discriminator:
                  propertyName: type
                oneOf:
                  - $ref: "#/components/schemas/ORStreamEventResponseCreated"
                  - $ref: "#/components/schemas/ORStreamEventResponseInProgress"
                  - $ref: "#/components/schemas/ORStreamEventOutputItemAdded"
                  - $ref: "#/components/schemas/ORStreamEventContentPartAdded"
                  - $ref: "#/components/schemas/ORStreamEventOutputTextDelta"
                  - $ref: "#/components/schemas/ORStreamEventOutputTextDone"
                  - $ref: "#/components/schemas/ORStreamEventContentPartDone"
                  - $ref: "#/components/schemas/ORStreamEventReasoningSummaryDelta"
                  - $ref: "#/components/schemas/ORStreamEventReasoningSummaryDone"
                  - $ref: "#/components/schemas/ORStreamEventFunctionCallArgumentsDelta"
                  - $ref: "#/components/schemas/ORStreamEventFunctionCallArgumentsDone"
                  - $ref: "#/components/schemas/ORStreamEventOutputItemDone"
                  - $ref: "#/components/schemas/ORStreamEventCompleted"
                  - $ref: "#/components/schemas/ORStreamEventError"
          description: Successful response
          headers:
            X-Opper-Cost:
              description: Execution cost of the request as a floating-point number.
              schema:
                format: double
                type: number
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          description: "Unauthorized - missing or invalid API key"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: OpenResponses API
      tags:
        - Compatibility
  /v3/compat/responses:
    post:
      description: OpenAI Responses API compatible endpoint. Supports streaming via the stream parameter.
      operationId: createResponse
      parameters:
        - description: Function name for tracing and project-level guardrail function-scope filtering.
          in: header
          name: X-Opper-Name
          schema:
            type: string
        - description: Parent span ID for distributed tracing context.
          in: header
          name: X-Opper-Parent-Span-Id
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponsesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsesResponse"
            text/event-stream:
              schema:
                description: "Server-Sent Events stream following the OpenAI Responses streaming protocol. Each event has an `event:` line and a `data: <json>` line. The stream terminates with a `response.completed` event whose payload carries the final `usage` (token counts and Opper `cost` extension)."
                type: string
          description: Successful response
          headers:
            X-Opper-Cost:
              description: Execution cost of the request as a floating-point number.
              schema:
                format: double
                type: number
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          description: "Unauthorized - missing or invalid API key"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Responses API
      tags:
        - Compatibility
  /v3/compat/v1/messages:
    post:
      description: Anthropic Messages API compatible endpoint. Supports streaming via the stream parameter.
      operationId: createMessage
      parameters:
        - description: Function name for tracing and project-level guardrail function-scope filtering.
          in: header
          name: X-Opper-Name
          schema:
            type: string
        - description: Parent span ID for distributed tracing context.
          in: header
          name: X-Opper-Parent-Span-Id
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesResponse"
            text/event-stream:
              schema:
                description: Server-Sent Events stream following the Anthropic Messages streaming protocol. The stream terminates with a `message_stop` event; the `message_delta` event preceding it carries the final `usage` and Opper `cost` extension.
                type: string
          description: Successful response
          headers:
            X-Opper-Cost:
              description: Execution cost of the request as a floating-point number.
              schema:
                format: double
                type: number
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          description: "Unauthorized - missing or invalid API key"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Messages API
      tags:
        - Compatibility
  /v3/compat/v1/models:
    get:
      description: Anthropic Models API compatible endpoint. Returns Opper LLM models in Anthropic's models.list shape so SDKs and tools (e.g. Claude Code's /model picker) can discover the live catalogue without hardcoding model IDs. Supports forward (after_id) and backward (before_id) cursor pagination on a deterministic featured-first, ID-ascending sort.
      operationId: listAnthropicCompatModels
      parameters:
        - description: Max models to return (1-1000, default 20).
          in: query
          name: limit
          schema:
            default: 20
            maximum: 1000
            minimum: 1
            type: integer
        - description: Forward-paginate before this model ID; unknown IDs are ignored.
          in: query
          name: before_id
          schema:
            type: string
        - description: Forward-paginate after this model ID; unknown IDs are ignored.
          in: query
          name: after_id
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicCompatModelsListResponse"
          description: Successful response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad request
        "401":
          description: "Unauthorized - missing or invalid API key"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: List models (Anthropic-compatible)
      tags:
        - Compatibility
  /v3/compat/v1beta/interactions:
    post:
      description: Google Interactions API compatible endpoint. Supports streaming via the stream parameter.
      operationId: createInteraction
      parameters:
        - description: Function name for tracing and project-level guardrail function-scope filtering.
          in: header
          name: X-Opper-Name
          schema:
            type: string
        - description: Parent span ID for distributed tracing context.
          in: header
          name: X-Opper-Parent-Span-Id
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionsResponse"
            text/event-stream:
